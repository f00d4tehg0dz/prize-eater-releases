<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#E58E00"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#7A3E00" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA80"/><stop offset="1" stop-color="#FFAE1A"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81F14"/><stop offset=".5" stop-color="#FF4A3A"/><stop offset="1" stop-color="#C81F14"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A5C"/><stop offset="1" stop-color="#D2261A"/>
    </linearGradient>
    <!-- the bite: three overlapping jaws plus small tooth notches -->
    <mask id="bite">
      <rect width="256" height="256" fill="#fff"/>
      <g fill="#000">
        <circle cx="222" cy="98" r="34"/>
        <circle cx="196" cy="70" r="27"/>
        <circle cx="236" cy="138" r="26"/>
        <path d="M185 96 l9 -4 l-2 10 z M203 110 l7 -6 l1 10 z M214 125 l9 -3 l-3 9 z M168 75 l10 -1 l-5 8 z"/>
      </g>
    </mask>
    <clipPath id="biteEdge">
      <rect x="42" y="108" width="172" height="124" rx="14"/><rect x="30" y="80" width="196" height="40" rx="11"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <g mask="url(#bite)">
      <!-- box -->
      <rect x="42" y="108" width="172" height="124" rx="14" fill="url(#box)"/>
      <rect x="42" y="108" width="172" height="124" rx="14" fill="url(#boxSide)"/>
      <rect x="112" y="108" width="32" height="124" fill="url(#rib)"/>
      <!-- lid -->
      <rect x="30" y="80" width="196" height="40" rx="11" fill="url(#lid)"/>
      <rect x="30" y="112" width="196" height="8" fill="#B86E00" opacity=".35"/>
      <rect x="110" y="80" width="36" height="40" fill="url(#rib)"/>
      <!-- inside of the bite: darker, bitten-through edge -->
      <g clip-path="url(#biteEdge)">
        <circle cx="222" cy="98" r="44" fill="none" stroke="#7A3E00" stroke-width="16" opacity=".6"/>
        <circle cx="196" cy="70" r="37" fill="none" stroke="#7A3E00" stroke-width="16" opacity=".6"/>
        <circle cx="236" cy="138" r="36" fill="none" stroke="#7A3E00" stroke-width="16" opacity=".6"/>
      </g>
      <!-- bow -->
      <path d="M128 78 C 104 40, 66 46, 76 70 C 82 84, 108 84, 128 78 Z" fill="url(#bow)"/>
      <path d="M128 78 C 152 40, 190 46, 180 70 C 174 84, 148 84, 128 78 Z" fill="url(#bow)"/>
      <path d="M118 72 C 106 60, 92 60, 92 68 C 94 74, 108 76, 118 72 Z" fill="#8E140C" opacity=".55"/>
      <path d="M138 72 C 150 60, 164 60, 164 68 C 162 74, 148 76, 138 72 Z" fill="#8E140C" opacity=".55"/>
      <rect x="116" y="66" width="24" height="20" rx="7" fill="#E5301F"/>
      <rect x="116" y="66" width="24" height="7" rx="3.5" fill="#FF7A6C" opacity=".7"/>
      <!-- top highlight on the lid -->
      <rect x="38" y="84" width="180" height="6" rx="3" fill="#FFF3CF" opacity=".55"/>
    </g>
  </g>
</svg>
